  - PETRIFIED_OAK_SLAB
  - FROGSPAWN
  - BUDDING_AMETHYST
  - SUSPICIOUS_SAND
  - SUSPICIOUS_GRAVEL
  # 下列物品必须匹配 ItemMeta/NBT；当前比赛规则只比较 Material，因此先强制排除。
  - POTION
  - SPLASH_POTION
  - LINGERING_POTION
  - ENCHANTED_BOOK
  - TIPPED_ARROW
  - OMINOUS_BOTTLE
  - SUSPICIOUS_STEW
  - WRITTEN_BOOK
  - FILLED_MAP
  - FIREWORK_ROCKET
  - FIREWORK_STAR
  - "*_SPAWN_EGG"
