# ItemRacing 任务物品目录（适用于 Minecraft/Paper 1.21.x）
#
# mandatory-exclusions：技术性、不可获得或当前仅按 Material 无法正确判定的物品。
# 玩家不能在大厅中重新启用这些物品。
# default-player-bans：可以正常取得但默认过难、过稀有或不适合普通比赛的物品。
# 玩家可以在大厅的“物品封禁”菜单中自由启用或封禁。
# 支持 * 和 ? 通配符；Material 名称不区分大小写。

mandatory-exclusions:
  - AIR
  - CAVE_AIR
  - VOID_AIR
  - WATER
  - LAVA
  - COMMAND_BLOCK
  - CHAIN_COMMAND_BLOCK
  - REPEATING_COMMAND_BLOCK
  - BARRIER
  - STRUCTURE_VOID
  - STRUCTURE_BLOCK
  - JIGSAW
  - LIGHT
  - DEBUG_STICK
  - KNOWLEDGE_BOOK
  - BEDROCK
